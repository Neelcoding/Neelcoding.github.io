<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Vial - Buy & Sell Fragrances</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Playfair+Display:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
	<link rel="stylesheet" href="css/marketplace.css" />
</head>
<body>

	<div id="demo-banner"></div>

	<header class="site-header">
		<div class="container">
			<a href="index.html" class="logo">Vi<span>al</span></a>
			<form class="header-search" id="header-search-form">
				<input type="text" id="header-search-input" placeholder="Search brand, scent, or notes…" />
				<button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
			</form>
			<nav class="main-nav">
				<a href="browse.html">Browse</a>
				<a href="sell.html">Sell</a>
			</nav>
			<div class="header-actions" id="header-actions"></div>
		</div>
	</header>

	<section class="hero">
		<div class="hero-copy">
			<h1>Find your signature scent.</h1>
			<div class="hero-cta-row">
				<a href="browse.html" class="btn btn-gold btn-lg">Browse the collection</a>
				<a href="sell.html" class="btn btn-outline btn-lg">Start selling</a>
			</div>
		</div>
		<figure class="hero-photo">
			<img src="images/hero-spray.jpg" alt="A woman spraying perfume onto her neck, with mist visible in the light" width="1536" height="1024" />
		</figure>
	</section>

	<section class="recent-section">
		<div class="container">
			<div class="recent-header">
				<h2 id="recent-title">Recently viewed</h2>
				<p class="recent-sub" id="recent-sub">Picking up where you left off.</p>
			</div>
			<div class="listing-grid" id="recent-grid"></div>
		</div>
	</section>

	<footer class="site-footer">
		<div class="container footer-inner"><span class="logo footer-logo">Vi<span>al</span></span><span class="footer-tag">Fragrance that changes hands, not a landfill trip.</span></div>
	</footer>

	<script type="module" src="js/nav.js"></script>
	<script type="module" src="js/home.js"></script>
</body>
</html>
